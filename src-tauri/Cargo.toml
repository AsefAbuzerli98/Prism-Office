[package]
name = "prism-office"
description = "Prism Office — unified Document / Workbook / Presentation desktop suite"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "prism_office_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
prism-openxml.workspace = true
prism-word.workspace = true
tauri = { version = "2", features = [] }
