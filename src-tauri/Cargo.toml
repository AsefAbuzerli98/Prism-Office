[package]
name = "prism-office"
description = "Prism Office — unified Document / Workbook / Presentation desktop suite"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "prism_office_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
prism-openxml.workspace = true
prism-word.workspace = true
prism-sheet.workspace = true
prism-slide.workspace = true
prism-drawingml.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

# TLS for the AI daemon: the OS stack on Windows/macOS (system trust store,
# no C toolchain needed), rustls + the platform verifier elsewhere.
# Secrets: Credential Manager / Keychain / Secret Service.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
