[package]
name = "prism-fuzz-libfuzzer"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
prism-fuzz = { path = "../crates/prism-fuzz" }

# Not part of the main workspace: needs nightly + `cargo install cargo-fuzz`.
[workspace]

[[bin]]
name = "openxml"
path = "fuzz_targets/openxml.rs"
test = false
doc = false
bench = false

