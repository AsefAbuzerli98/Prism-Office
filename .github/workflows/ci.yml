name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (arm64); windows-11-arm covers Windows on ARM64
        os: [ubuntu-latest, macos-latest, macos-13, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: System dependencies (Tauri on Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: Swatinem/rust-cache@v2
      - run: mkdir -p dist && echo '<!doctype html>' > dist/index.html
        shell: bash
      - run: cargo fmt --all -- --check
        if: runner.os == 'Linux'
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  fuzz-smoke:
    # Stable mutation fuzzer over all parser targets (crates/prism-fuzz); longer runs: fuzz/README.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p prism-fuzz --release -- all 240 ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: target/fuzz-artifacts/

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
