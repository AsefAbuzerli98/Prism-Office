[package]
name = "prism-sheet"
description = "Spreadsheet model, formula engine (dynamic arrays) and XLSX import/export for Prism Office"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["xlsx"]
xlsx = ["dep:prism-openxml", "dep:quick-xml"]
wasm = ["dep:wasm-bindgen"]

[dependencies]
prism-openxml = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
wasm-bindgen = { version = "=0.2.130", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"

[dev-dependencies]
