[workspace]
resolver = "2"
exclude = ["fuzz"]
members = ["crates/prism-openxml", "crates/prism-word", "crates/prism-sheet", "crates/prism-drawingml", "crates/prism-slide", "crates/prism-fuzz", "src-tauri"]
default-members = ["crates/prism-openxml", "crates/prism-word", "crates/prism-sheet", "crates/prism-drawingml", "crates/prism-slide"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
prism-openxml = { path = "crates/prism-openxml" }
prism-word = { path = "crates/prism-word" }
prism-sheet = { path = "crates/prism-sheet" }
prism-drawingml = { path = "crates/prism-drawingml" }
prism-slide = { path = "crates/prism-slide" }
thiserror = "2"
quick-xml = "0.42"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.wasm]
inherits = "release"
opt-level = "s"
panic = "abort"
strip = "debuginfo"

[profile.release]
lto = true
codegen-units = 1
strip = true
